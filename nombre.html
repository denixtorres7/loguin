<!DOCTYPE html>

<html>

<head>

<style>

body{

margin:0;

background:transparent;

overflow:hidden;

font-family:Arial;

}

#nombreMostrado{

font-size:40px;

font-weight:900;

color:white;

text-transform:uppercase;

}

</style>

</head>

<body>

<div id="nombreMostrado"></div>

<script>

const nombre=

localStorage.getItem(
"nombreUsuario"
);

document
.getElementById(
"nombreMostrado"
)
.innerHTML=

nombre || "INVITADO";

</script>

</body>

</html>
