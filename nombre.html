<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

html,body{
margin:0;
padding:0;
overflow:hidden;
background:transparent;
}

#nombreMostrado{

font-family:'Poppins',sans-serif;

font-size:38px;

font-weight:700;

color:white;

text-transform:uppercase;

text-align:left;

}

</style>

</head>

<body>

<div id="nombreMostrado"></div>

<script>

const nombre=
localStorage.getItem(
"nombreUsuario"
);

document
.getElementById(
"nombreMostrado"
)
innerHTML=
nombre || "";

</script>

</body>

</html>
