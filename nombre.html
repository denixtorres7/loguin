<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

html,body{
margin:0;
padding:0;
width:420px;
height:70px;
overflow:hidden;
background:transparent;
}

#nombreMostrado{
font-family:'Poppins',sans-serif;
font-size:28px;
font-weight:700;
color:white;
text-transform:uppercase;
line-height:70px;
text-align:left;
}
</style>
</head>

<body>

<div id="nombreMostrado"></div>

<script>
function mostrarNombre(){
const nombre = localStorage.getItem("nombreUsuario");
document.getElementById("nombreMostrado").innerHTML = nombre || "";
}

mostrarNombre();
setInterval(mostrarNombre,300);
</script>

</body>
</html>
