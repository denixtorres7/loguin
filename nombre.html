<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');

html,body{
margin:0;
padding:0;
width:500px;
height:80px;
overflow:hidden;
background:transparent;
}

#nombreMostrado{
font-family:'Poppins',sans-serif;
font-size:32px;
font-weight:700;
color:white;
text-transform:uppercase;
text-align:left;
line-height:80px;
}
</style>
</head>

<body>

<div id="nombreMostrado"></div>

<script>
function mostrarNombre(){

    const nombre = localStorage.getItem("nombreUsuario");

    document.getElementById("nombreMostrado").innerHTML =
    nombre ? nombre : "";
}

mostrarNombre();

setInterval(mostrarNombre, 300);
</script>

</body>
</html>
