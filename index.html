<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Skeleton</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="pantalla">

    <!-- GUIAS VISUALES -->

<div class="guia guiaNombre">NOMBRE ↓</div>

<input 
type="text"
id="nombre"
class="nombre"
placeholder="Nombre"
>

    <!-- INPUT NOMBRE -->
    <input 
        type="text" 
        id="nombre"
        class="nombre"
        placeholder="TU NOMBRE"
    >


<div class="guia guiaEmail">EMAIL ↓</div>

<input
type="email"
id="email"
class="email"
placeholder="Email"
>

    <!-- INPUT EMAIL -->
    <input 
        type="email" 
        id="email"
        class="email"
    >

<div class="guia guiaPassword">PASSWORD ↓</div>

<input
type="password"
id="password"
class="password"
placeholder="Password"
>

    <!-- INPUT PASSWORD -->
    <input 
        type="password" 
        id="password"
        class="password"
    >

    <!-- BOTÓN LOGIN -->
    <button class="btn-login" onclick="login()"></button>

    <!-- MENSAJE -->
    <div id="mensaje"></div>

</div>

<script src="script.js"></script>

</body>
</html>
