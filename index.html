<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Login</title>

<link rel="stylesheet" href="copia de style.css">

</head>

<body>

<div class="pantalla">

<input
type="text"
id="nombre"
class="nombre"
placeholder="TU NOMBRE">

<input
type="email"
id="email"
class="email"
placeholder="E-MAIL">

<input
type="password"
id="password"
class="password"
placeholder="CONTRASEÑA">

<button
class="btn-login"
onclick="login()">
ENTRAR
</button>

<div id="mensaje"></div>

</div>

<script src="copia de script.js"></script>

</body>
</html>
