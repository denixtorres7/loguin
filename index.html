<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="pantalla">

<input
type="text"
id="nombre"
class="nombre"
placeholder="Nombre"
>

<input
type="email"
id="email"
class="email"
placeholder="Email"
>

<input
type="password"
id="password"
class="password"
placeholder="Password"
>

<button
class="btn-login"
onclick="login()">
</button>

<div id="mensaje"></div>

</div>

<script src="scrpt.js"></script>

</body>
</html>
